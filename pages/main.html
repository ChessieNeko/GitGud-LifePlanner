<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돈 있어요</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navmenu.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Transações</a></li>
            <li class="menu-toggle-wrapper">
                <button class="menu-toggle">☰</button>

                <div class="floating-menu">
                    <a href="addIncome.html" class="item">+</a>
                    <a href="addExpenses.html" class="item">-</a>
                </div>
            </li>
            <li><a href="#">Goals</a></li>
            <li><a href="#">Profile</a></li>
        </ul>
    </nav>
    <div id="app">
        <div class="balance-display">
            <div class="current-balance">
                <h2>Total Balance:</h2>
                <span class="balance-value">R$100</span>
            </div>
            <div class="income-expenses">
                <div class="current-income">
                    <h2>Income:</h2>
                    <span class="income-value">R$100</span>
                </div>
                <div class="current-expense">
                    <h2>Expenses:</h2>
                    <span class="expense-value">R$100</span>
                </div>
            </div>
        </div>


        <form id="income-form">
            <h1>Entrada</h1>

            <label for="">Valor
                <input type="number">
            </label>
            <label for="income-type">Tipo</label>
            <select name="income-type" id="income-type">
                <option value="salary">Salário</option>
                <option value="extra">Extra</option>
            </select>
            
            <label for="">Data
                <input type="date">
            </label>
            <label for="">Descrição
                <input type="text">
            </label>
            
            <button type="submit">Registrar</button>
        </form>
        <form id="expense-form">
            <h1>Saída</h1>

            <label for="">Valor
                <input type="number">
            </label>

            <label for="">Data
                <input type="date">
            </label>
            <label for="">Descrição
                <input type="text">
            </label>
            <div class="form-tags">Tag
                <input type="checkbox" id="food" name="food" value="food">
                <label for="food">Comida</label>
                <input type="checkbox" id="kpop" name="kpop" value="kpop">
                <label for="kpop">K-pop</label>
                <input type="checkbox" id="work" name="work" value="work">
                <label for="work">Trabalho</label>
                <input type="checkbox" id="house" name="house" value="house">
                <label for="house">Casa</label>
                <input type="checkbox" id="study" name="study" value="study">
                <label for="study">Estudos</label>
            </div>
            
            <button type="submit">Registrar</button>
        </form>

    </div>
    <script src="../js/script.js"></script>
</body>
</html>
